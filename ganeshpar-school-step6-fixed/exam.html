<!DOCTYPE html>
<html lang="gu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ઓનલાઈન પરીક્ષા | ગણેશપર પ્રાથમિક શાળા</title><link rel="icon" href="images/logo.png"><link rel="stylesheet" href="exam.css"></head>
<body>
<header class="exam-top"><a href="student-dashboard.html" class="brand"><img src="images/logo.png"><span>ગણેશપર પ્રાથમિક શાળા</span></a><div class="top-right"><span>🎓 <b>ધોરણ <span id="standardName">6</span></b></span><span class="timer" id="timer">30:00</span></div></header>
<main class="exam-container">
<section class="exam-start" id="examStart"><div class="eyebrow">STEP 4 • ONLINE EXAM</div><h1>ઓનલાઈન MCQ પરીક્ષા</h1><p>આ પરીક્ષા માટે પ્રશ્નો તમારા આપેલા ધોરણ 6ના GCERT પ્રશ્નબૅંકના વિષયો/સ્તર પરથી તૈયાર કરેલા છે. દરેક ટેસ્ટમાં 30 MCQ છે.</p><div class="select-row"><label>વિષય<select id="subjectSelect"></select></label></div><button id="startBtn" class="primary">પરીક્ષા શરૂ કરો →</button></section>
<section id="examArea" class="hidden"><div class="exam-head"><div><span id="progress"></span><h2 id="questionText"></h2></div><button id="quitBtn" class="danger">પરીક્ષા છોડો</button></div><div class="layout"><div class="question-card"><div id="options"></div><div class="nav"><button id="prevBtn" class="secondary">← પાછળ</button><button id="nextBtn" class="primary">આગળ →</button></div></div><aside class="question-nav"><h3>પ્રશ્નો</h3><div id="questionMap"></div></aside></div></section>
<section id="resultArea" class="result hidden"><div class="result-icon">🏆</div><div class="eyebrow">EXAM RESULT</div><h1>તમારું પરિણામ</h1><div class="score" id="scoreText">0 / 30</div><div class="percent" id="scorePercent">0%</div><p id="resultMessage"></p><div class="result-actions"><button id="restartBtn" class="primary">ફરી પરીક્ષા આપો</button><button id="backBtn" class="secondary">ડેશબોર્ડ પર જાઓ</button><button id="marksheetBtn" class="secondary">📄 માર્કશીટ જુઓ</button></div></section>
</main><script src="exam.js"></script></body></html>
